<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Resignation & Clearance</title><meta name="description" content="Manage resignation documents and sequential employee clearance approvals."><style>
:root{--navy:#132e32;--teal:#11766a;--mint:#e9f4ef;--orange:#eaa55a;--ink:#203838;--muted:#72827e;--line:#e1e7e3;--bg:#f5f7f3}*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer}button{border:1px solid var(--line);border-radius:8px;background:white;padding:10px 16px;color:var(--ink);font-weight:600}button:hover{filter:brightness(.96)}.primary{background:var(--teal);color:white;border-color:var(--teal)}.danger{color:#a13636;background:#fff3f1;border-color:#f0d7d3}.layout{display:flex;min-height:100vh}aside{width:244px;background:var(--navy);color:#d3e2db;padding:30px 20px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column}.brand{display:flex;gap:11px;align-items:center;color:white;font-size:18px;font-weight:700;letter-spacing:-.5px}.mark{background:#d9eee0;color:var(--navy);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;font-size:22px}.brand small{display:block;color:#9bb8ae;font-size:10px;letter-spacing:2px;text-transform:uppercase}.navlabel{font-size:10px;letter-spacing:2px;color:#87a79e;margin:45px 12px 13px}nav button{width:100%;text-align:left;background:none;color:#bcd0c6;border:0;margin-bottom:7px;padding:12px 14px}nav button.active{background:#295047;color:white}nav button span{display:inline-block;width:27px}.sidebottom{margin-top:auto;border-top:1px solid #35514e;padding-top:22px;font-size:12px;color:#9fb8ad}.sidebottom b{color:#e3ebe6;display:block;margin-bottom:6px}.main{margin-left:244px;flex:1;min-width:0}header{height:82px;background:#fff;border-bottom:1px solid var(--line);padding:0 42px;display:flex;justify-content:space-between;align-items:center}.breadcrumb{color:var(--muted);font-size:12px}.role{display:flex;gap:10px;align-items:center;font-size:12px}select,input,textarea{background:white;border:1px solid #d9e2dc ht:650}td,th{padding:16px 24px;border-bottom:1px solid #edf0ec;white-space:nowrap}td{font-size:12px}td b{font-size:13px}td small{display:block;color:var(--muted);margin-top:3px}.textbtn{color:var(--teal);border:0;background:transparent;padding:4px 0}.empty{text-align:center;padding:52px 24px}.empty .bigicon{font-size:32px;color:#83aa99;margin-bottom:10px}.empty p{margin-bottom:20px}.flow{padding:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px 12px}.flowitem{display:flex;align-items:flex-start;gap:9px;font-size:12px}.flowitem .circle{width:26px;height:26px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:#eef3ed;color:#718a7b;font-size:11px}.flowitem small{display:block;color:var(--muted);font-size:10px}.panelbody{padding:24px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:19px}label{display:block;font-size:12px;font-weight:600}label input,label select,label textarea{display:block;width:100%;margin-top:7px;font-weight:400}textarea{resize:vertical;min-height:92px}.full{grid-column:1/-1}.help{font-size:11px;color:var(--muted);margin-top:7px}.upload{border:1px dashed #b9cfc2;background:#f8fbf7;border-radius:8px;padding:20px}.upload input{border:0;background:transparent;padding:10px 0;font-size:12px}.actions{display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap;margin-top:24px}.detailgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:20px}.facts small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.timeline{padding:24px}.step{position:relative;padding:0 0 24px 37px;border-left:1px solid var(--line);margin-left:12px;min-height:67px}.step:last-child{border:0;padding-bottom:0}.step:before{content:attr(data-num);position:absolute;left:-13px;top:0;width:25px;height:25px;border-radius:50%;background:#f0f3ee;color:#849285;display:grid;place-items:center;font-size:10px;border:3px solid white}.step.done:before{content:'✓';background:#dceee2;color:#237856}.step.current:before{background:var(--teal);color:white}.step b{font-size:12px}.step small{display:block;font-size:10px;color:var(--muted)}.history{border-bottom:1px solid var(--line);padding:13px 0;font-size:12px}.history small{display:block;color:var(--muted)}.file{padding:13px;border:1px solid var(--line);border-radius:8px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:13px 22px;background:var(--navy);color:#fff;box-shadow:0 5px 25px #0002;border-radius:8px;z-index:99}.sectionnote{border-left:3px solid var(--orange);background:#fbf7ef;padding:13px 16px;font-size:12px;margin-bottom:22px}.mini{font-size:11px}.back{margin-bottom:17px}.settingsrow{padding:17px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:110px 1fr;gap:20px;align-items:center}@media(max-width:1050px){aside{width:190px}.main{margin-left:190px}main{padding:25px}header{padding:0 25px}.detailgrid{grid-template-columns:1fr}.flow{grid-template-columns:repeat(2,1fr)}.stats{gap:10px}.stat{padding:17px}}@media(max-width:700px){aside{position:static;width:100%;padding:16px}.layout{display:block}.brand small,.navlabel,.sidebottom{display:none}nav{display:flex;overflow:auto;margin-top:15px}nav button{width:auto;white-space:nowrap;padding:9px;margin:0 5px 0 0;font-size:12px}.main{margin:0}header{height:auto;padding:14px 18px;gap:10px}.breadcrumb{display:none}.role{width:100%}.role select{flex:1;max-width:none}main{padding:20px 16px}.titleline{align-items:flex-start}h1{font-size:25px}.stats{grid-template-columns:1fr 1fr}.fields,.grid2{grid-template-columns:1fr}.full{grid-column:auto}.panelhead{padding:18px}.panelbody{padding:18px}.flow{padding:18px}.titleline>button{font-size:12px;padding:10px}.facts{gap:15px}.toolbar{padding:15px}.notice{font-size:11px}}@media print{aside,header,.notice,button,.toolbar,.approvalbox{display:none!important}.main{margin:0}main{padding:0}.panel{break-inside:avoid}.detailgrid{display:block}.panel{border:1px solid #ccc}body{background:white}}
</style></head><body><div class="layout"><aside><div class="brand"><div class="mark">↗</div><div>ClearPath<small>Employee services</small></div></div><div class="navlabel">WORKSPACE</div><nav><button data-view="dashboard"><span>▦</span>Overview</button><button data-view="requests"><span>▤</span>All requests</button><button data-view="approvals"><span>✓</span>Approval inbox</button><button data-view="routing"><span>⇄</span>Department routing</button></nav><div class="sidebottom"><b>Every step. One clear path.</b>A structured exit process from document intake to travel clearance.<p style="margin-top:20px">PORT OF SALALAH<br>Workflow concept · v1.0</p></div></aside><div class="main"><header><div class="breadcrumb">Employee services <span style="padding:0 12px">/</span> Resignation & clearance</div><div class="role"><span class="avatar">P</span><span class="muted">Preview role</span><select id="role" aria-label="Preview role"></select></div></header><main id="app"></main></div></div><div id="toast" class="toast" hidden role="status"></div><script>
const departments=['M&R','CTOPS','IT','HR','Commercial','Corporate','HSSE','HUB','Marine','GCT'];
const stages=['Staff Allocation','Department GM','IT GM','Oasis Club Manager','Finance','HRD','HRD Employee Service','Travel Desk'];
const roleEl=document.querySelector('#role'),app=document.querySelector('#app');
let role='Staff Allocation',view='dashboard',selected=null,records=[],routing={},db;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opts=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
const now=()=>new Date().toISOString();const date=s=>s?new Date(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';
const stamp=s=>new Date(s).toLocaleString('en-GB',{timeZone:'Asia/Muscat',hour12:false});
const status=r=>r.state==='active'?'Awaiting approval':({draft:'Draft',returned:'Returned for correction',rejected:'Rejected',complete:'Completed'})[r.state];
const current=r=>r.state==='complete'?'All clearances complete':r.state==='draft'||r.state==='returned'?'Staff Allocation':stages[r.stage];
const badge=r=>`<span class="pill ${r.state==='active'?'pending':r.state}">${status(r)}</span>`;
const gm=r=>routing[r.department]||`${r.department} General Manager`;
const stageLabel=(r,i)=>i===1?`${r.department} General Manager`:stages[i];
const notice=()=>'<div class="notice"><b>Workflow preview</b> · Records and documents are saved only in this browser. Role switching simulates approvals; company sign-in, shared access and notifications are not connected. Use sample documents.</div>';
function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.hidden=false;setTimeout(()=>t.hidden=true,4200)}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function request(p){return new Promise((ok,no)=>{p.onsuccess=()=>ok(p.result);p.onerror=()=>no(p.error)})}
async function persist(){await new Promise((ok,no)=>{const t=db.transaction('data','readwrite');t.objectStore('data').put(records,'records');t.objectStore('data').put(routing,'routing');t.oncomplete=ok;t.onerror=()=>no(t.error)})}
async function safeSave(){try{await persist();return true}catch{toast('Could not save. Browser storage may be full.');return false}}
function go(v,id){view=v;selected=id||null;render();window.scrollTo(0,0)}
function title(eyebrow,heading,sub,action=''){return `<div class="titleline"><div><div class="eyebrow">${eyebrow}</div><h1>${heading}</h1><p class="muted">${sub}</p></div>${action}</div>`}
function newBtn(){return '<button class="primary" id="new">＋ New request</button>'}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));roleEl.innerHTML=opts([...stages.filter(s=>s!=='Department GM'),...departments.map(d=>`${d} General Manager`)],role);app.innerHTML=notice();if(view==='new'){renderForm();return}if(view==='detail'){renderDetail();return}if(view==='routing'){renderRouting();return}renderList();}
function renderList(){let pending=records.filter(r=>r.state==='active'),mine=pending.filter(canApprove);app.innerHTML+=title('EXIT MANAGEMENT',view==='dashboard'?'Employee resignation & clearance':view==='approvals'?'Approval inbox':'All resignation requests',view==='approvals'?'Review documents and complete the next clearance in sequence.':'A clear view of every request, document and approval.',newBtn());if(view==='dashboard'){app.innerHTML+=`<div class="stats">${[['Total requests',records.length,'All employee exit requests'],['In progress',pending.length,'Moving through clearance'],['Your approvals',mine.length,'Ready for your review'],['Completed',records.filter(r=>r.state==='complete').length,'All eight stages approved']].map((s,i)=>`<div class="stat"><span class="dot">${['▤','◷','✓','↗'][i]}</span><div class="muted">${s[0]}</div><div class="num">${s[1]}</div><small>${s[2]}</small></div>`).join('')}</div>`}
app.innerHTML+=`<section class="panel"><div class="panelhead"><h2>${view==='approvals'?'Ready for your decision':'Request register'}</h2><button id="csv" class="textbtn">↓ Export CSV</button></div><div class="toolbar"><input id="search" placeholder="Search employee name, ID or request…" aria-label="Search requests"><select id="filter" aria-label="Status filter"><option value="all">All statuses</option>${['draft','active','returned','rejected','complete'].map(v=>`<option value="${v}">${v==='active'?'In progress':v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select></div><div id="register"></div></section>`;
if(view==='dashboard')app.innerHTML+=`<section class="panel"><div class="panelhead"><div><h2>The clearance journey</h2><p class="muted mini">One sequential process. The next stage unlocks after approval.</p></div><span class="pill">8 approval stages</span></div><div class="flow">${stages.map((s,i)=>`<div class="flowitem"><div class="circle">0${i+1}</div><div><b>${s}</b><small>${['Document intake & validation','Based on employee department','IT clearance','Club clearance','Financial clearance','HRD clearance','Employee service clearance','Final travel clearance'][i]}</small></div></div>`).join('')}</div></section>`;
document.querySelector('#new').onclick=()=>{if(role!=='Staff Allocation'){toast('Switch the preview role to Staff Allocation to create a request.');return}go('new')};document.querySelector('#csv').onclick=exportCSV;document.querySelector('#search').oninput=drawTable;document.querySelector('#filter').onchange=drawTable;drawTable();}
function canApprove(r){return r.state==='active'&&(r.stage===1?role===`${r.department} General Manager`:role===stages[r.stage])}
function drawTable(){let q=document.querySelector('#search').value.toLowerCase(),f=document.querySelector('#filter').value;let rows=records.filter(r=>(view!=='approvals'||canApprove(r))&&(f==='all'||r.state===f)&&[r.name,r.employeeId,r.id,r.department].join(' ').toLowerCase().includes(q));document.querySelector('#register').innerHTML=rows.length?`<div class="tablewrap"><table><thead><tr><th>Employee / request</th><th>Department</th><th>Last working day</th><th>Current stage</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.name||'Untitled draft')}</b><small>${esc(r.employeeId||'No ID')} · ${esc(r.id)}</small></td><td>${esc(r.department)}</td><td>${date(r.lastDay)}</td><td>${esc(current(r))}<small>${r.state==='active'?`${r.stage} of 8 approvals complete`:''}</small></td><td>${badge(r)}</td><td><button class="textbtn open" data-id="${r.id}">View request →</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div class="bigicon">▤</div><h3>${view==='approvals'?'Your inbox is clear':'No requests to show'}</h3><p class="muted">${view==='approvals'?'Requests will appear when this role is next in the approval sequence.':'Create a request to begin the employee clearance journey.'}</p></div>`;document.querySelectorAll('.open').forEach(b=>b.onclick=()=>go('detail',b.dataset.id));}
function field(label,name,type='text',value='',required=true){return `<label>${label}${required?' *':''}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}></label>`}
function renderForm(){let r=records.find(r=>r.id===selected)||{},editing=!!r.id;if(role!=='Staff Allocation'){go('dashboard');return}app.innerHTML+=`<button class="back textbtn" id="back">← Back to requests</button>`+title('STAFF ALLOCATION',editing?'Update resignation request':'New resignation request','Receive the employee’s physical papers, upload copies and verify the details.');app.innerHTML+=`<form id="intake"><section class="panel"><div class="panelhead"><h2>01 · Employee details</h2><span class="pill">Manual document handover</span></div><div class="panelbody fields">${field('Employee full name','name','text',r.name)}${field('Employee ID','employeeId','text',r.employeeId)}<label>Department *<select name="department" required><option value="">Select department</option>${opts(departments,r.department)}</select></label>${field('Job title','jobTitle','text',r.jobTitle)}${field('Resignation letter date','letterDate','date',r.letterDate)}${field('Last working day','lastDay','date',r.lastDay)}${field('Employee email','email','email',r.email,false)}${field('Contact number','phone','tel',r.phone,false)}<label class="full">Staff Allocation notes<textarea name="notes" placeholder="Document handover details or additional information">${esc(r.notes)}</textarea></label></div></section><section class="panel"><div class="panelhead"><h2>02 · Required documents</h2><span class="muted mini">PDF, JPG or PNG · max 10 MB each</span></div><div class="panelbody"><div class="grid2">${['letter','noc'].map((k,i)=>`<label class="upload">${i?'Bank no-objection certificate (NOC)':'Resignation letter'} *<input type="file" name="${k}" accept="application/pdf,image/jpeg,image/png"><div class="help">${r[k]?`Existing file: ${esc(r[k].name)}. Choose a file to replace it.`:'Upload a scan of the document received by Staff Allocation.'}</div></label>`).join('')}</div><label style="margin-top:22px"><input type="checkbox" name="received" style="display:inline;width:auto;margin:0 8px 0 0" ${r.received?'checked':''}>I confirm the employee handed over both documents to Staff Allocation.</label></div></section><div class="sectionnote"><b>Approval route</b><br>Staff Allocation → Employee’s Department GM → IT GM → Oasis Club Manager → Finance → HRD → HRD Employee Service → Travel Desk</div><div class="actions"><button type="button" id="cancel">Cancel</button><button type="button" id="draft">Save draft</button><button type="submit" class="primary">Submit for Staff Allocation approval →</button></div></form>`;document.querySelector('#back').onclick=()=>go('requests');document.querySelector('#cancel').onclick=()=>go('requests');document.querySelector('#draft').onclick=()=>saveIntake(false,r);document.querySelector('#intake').onsubmit=e=>{e.preventDefault();saveIntake(true,r)};}
async function saveIntake(submit,existing){const form=document.querySelector('#intake');if(submit&&!form.reportValidity())return;const fd=new FormData(form);let r={...existing};for(const k of ['name','employeeId','department','jobTitle','letterDate','lastDay','email','phone','notes'])r[k]=String(fd.get(k)||'').trim();r.received=fd.get('received')==='on';for(const key of ['letter','noc']){const f=fd.get(key);if(f?.size){if(f.size>10*1024*1024||!['application/pdf','image/jpeg','image/png'].includes(f.type)){toast('Upload PDF, JPG or PNG files, up to 10 MB each.');return}r[key]={name:f.name,type:f.type,blob:f}}}if(submit&&(!r.letter||!r.noc||!r.received)){toast('Upload both documents and confirm their physical receipt.');return}if(submit&&r.lastDay<r.letterDate){toast('Last working day cannot be before the resignation letter date.');return}r.id=r.id||'ERC-'+Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>b.toString(16).padStart(2,'0')).join('').toUpperCase();r.created=r.created||now();r.updated=now();r.state=submit?'active':'draft';r.stage=0;r.history=[...(r.history||[]),{time:now(),action:submit?'Submitted for Staff Allocation approval':'Draft saved',by:'Staff Allocation',comment:r.state==='active'&&existing.state==='returned'?'Resubmitted; approval sequence restarted.':''}];if(submit)r.decisions=[];const backup=records;records=[r,...records.filter(x=>x.id!==r.id)];if(await safeSave()){toast(submit?'Request submitted. Staff Allocation review is next.':'Draft saved.');go('detail',r.id)}else records=backup;}
function renderDetail(){const r=records.find(x=>x.id===selected);if(!r){go('requests');return}app.innerHTML+=`<button class="back textbtn" id="back">← Back to requests</button>`+title(esc(r.id),esc(r.name||'Untitled draft'),`${esc(r.employeeId||'No employee ID')} · ${esc(r.department||'Department pending')} · Created ${date(r.created)}`,`<button id="print">Print summary</button>`);app.innerHTML+=`<div class="detailgrid"><div><section class="panel"><div class="panelhead"><h2>Request details</h2>${badge(r)}</div><div class="panelbody"><div class="facts">${[['Job title',r.jobTitle],['Department',r.department],['Letter date',date(r.letterDate)],['Last working day',date(r.lastDay)],['Employee email',r.email],['Contact number',r.phone],['Department GM route',gm(r)],['Physical documents received',r.received?'Yes':'Not confirmed']].map(x=>`<div><small>${x[0]}</small><b>${esc(x[1]||'—')}</b></div>`).join('')}</div>${r.notes?`<div style="margin-top:22px"><h3>Intake notes</h3><p style="white-space:pre-wrap">${esc(r.notes)}</p></div>`:''}</div></section><section class="panel"><div class="panelhead"><h2>Supporting documents</h2><span class="muted mini">Uploaded by Staff Allocation</span></div><div class="panelbody">${['letter','noc'].map((k,i)=>`<div class="file"><div><b>${i?'Bank NOC':'Resignation letter'}</b><div class="muted">${esc(r[k]?.name||'Not uploaded')}</div></div>${r[k]?`<button class="textbtn download" data-key="${k}">Download ↓</button>`:''}</div>`).join('')}</div></section>${renderDecision(r)}<section class="panel"><div class="panelhead"><h2>Activity history</h2><span class="muted mini">Oman time · UTC+4</span></div><div class="panelbody">${[...(r.history||[])].reverse().map(h=>`<div class="history"><b>${esc(h.action)}</b><small>${esc(h.by)} · ${stamp(h.time)}</small>${h.comment?`<p style="white-space:pre-wrap">${esc(h.comment)}</p>`:''}</div>`).join('')}</div></section></div><section class="panel" style="align-self:start"><div class="panelhead"><h2>Clearance progress</h2></div><div class="timeline">${stages.map((s,i)=>{let d=(r.decisions||[]).find(x=>x.stage===i);return `<div class="step ${d?'done':r.state==='active'&&r.stage===i?'current':''}" data-num="${i+1}"><b>${esc(stageLabel(r,i))}</b><small>${d?`Approved · ${date(d.time)}`:r.state==='active'&&r.stage===i?'Awaiting approval':r.state==='complete'?'Approved':'Pending'}</small>${d?`<small>${esc(d.name)}</small>`:''}</div>`}).join('')}</div></section></div>`;document.querySelector('#back').onclick=()=>go('requests');document.querySelector('#print').onclick=()=>window.print();document.querySelectorAll('.download').forEach(b=>b.onclick=()=>download(r[b.dataset.key].blob,r[b.dataset.key].name));if(document.querySelector('#edit'))document.querySelector('#edit').onclick=()=>go('new',r.id);document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>decide(r,b.dataset.decision));}
function renderDecision(r){if(['draft','returned'].includes(r.state)){return `<section class="panel approvalbox"><div class="panelbody"><h3>${r.state==='draft'?'Complete document intake':'Correction required'}</h3><p class="muted">Staff Allocation can update the details and documents, then submit the request.</p>${role==='Staff Allocation'?'<button id="edit" class="primary" style="margin-top:15px">Edit request →</button>':''}</div></section>`}if(r.state==='complete')return '<section class="panel"><div class="panelbody" style="background:var(--mint)"><h3>✓ All clearances approved</h3><p>The Travel Desk has completed the final approval.</p></div></section>';if(r.state==='rejected')return '<section class="panel"><div class="panelbody"><h3>Request rejected</h3><p>This request is closed. Its document and decision history remain available.</p></div></section>';if(!canApprove(r))return `<section class="panel approvalbox"><div class="panelbody"><h3>Awaiting ${esc(current(r))}</h3><p class="muted">Switch the preview role to ${esc(r.stage===1?`${r.department} General Manager`:current(r))} to test this decision.</p></div></section>`;return `<section class="panel approvalbox"><div class="panelhead"><h2>${esc(current(r))} review</h2><span class="pill pending">Your approval</span></div><div class="panelbody"><p class="muted" style="margin-bottom:20px">${['Verify the resignation letter and bank NOC against the documents received.','Review the employee’s resignation and department handover.','Confirm IT asset returns and access clearance.','Confirm club clearance and any outstanding obligations.','Confirm financial clearance and any outstanding amounts.','Review HRD clearance requirements.','Confirm employee service clearance requirements.','Confirm travel clearance and complete the request.'][r.stage]}</p><div class="fields"><label class="full">Reviewer name *<input id="reviewer" placeholder="Enter your full name" required></label><label class="full">Decision comments<textarea id="comment" placeholder="Clearance notes; required when returning or rejecting"></textarea></label></div><label style="margin-top:18px"><input id="verified" type="checkbox" style="display:inline;width:auto;margin:0 7px 0 0">I have reviewed the documents and this stage’s clearance requirements.</label><div class="actions"><button class="danger" data-decision="reject">Reject</button><button data-decision="return">Return for correction</button><button class="primary" data-decision="approve">${r.stage===7?'Approve & complete':'Approve & forward →'}</button></div></div></section>`}
async function decide(r,decision){if(!canApprove(r))return;let name=document.querySelector('#reviewer').value.trim(),comment=document.querySelector('#comment').value.trim();if(!name){toast('Enter the reviewer’s name.');return}if(decision!=='approve'&&!comment){toast('Add a reason for returning or rejecting.');return}if(decision==='approve'&&!document.querySelector('#verified').checked){toast('Confirm you reviewed the documents and requirements.');return}if(decision==='approve'&&(!r.letter||!r.noc)){toast('Both documents are required for approval.');return}let copy=structuredClone(r);const stage=copy.stage,time=now();copy.history.push({time,action:`${stageLabel(copy,stage)} — ${decision==='approve'?'Approved':decision==='return'?'Returned for correction':'Rejected'}`,by:`${name} (${role})`,comment});if(decision==='approve'){copy.decisions=copy.decisions||[];copy.decisions.push({stage,time,name,comment,role});copy.stage++;if(copy.stage===8)copy.state='complete'}else copy.state=decision==='return'?'returned':'rejected';copy.updated=time;const backup=records;records=records.map(x=>x.id===r.id?copy:x);if(await safeSave()){toast(decision==='approve'?(copy.state==='complete'?'All eight clearance stages completed.':`Forwarded to ${current(copy)}.`):decision==='return'?'Returned to Staff Allocation for correction.':'Request rejected.');render()}else records=backup;}
function renderRouting(){app.innerHTML+=title('WORKFLOW SETUP','Department routing','The employee’s department determines the General Manager approval route.');app.innerHTML+=`<div class="sectionnote">Each department has a separate GM preview role. Names below are reference labels; they do not create accounts or send approval notifications.</div><section class="panel"><div class="panelhead"><h2>Department General Managers</h2><span class="pill">Stage 02</span></div><form class="panelbody" id="routes">${departments.map(d=>`<div class="settingsrow"><b>${esc(d)}</b><label>GM name / reference<input name="${esc(d)}" value="${esc(routing[d]||'')}" placeholder="${esc(d)} General Manager"></label></div>`).join('')}<div class="actions"><button class="primary" type="submit">Save department routing</button></div></form></section>`;document.querySelector('#routes').onsubmit=async e=>{e.preventDefault();let old=routing;routing=Object.fromEntries(new FormData(e.target));if(await safeSave())toast('Department routing saved.');else routing=old};}
function download(blob,name){const url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportCSV(){const cell=v=>'"'+String(v??'').replace(/^[=+@\-]/,"'$&").replace(/"/g,'""')+'"';let data=[['Request ID','Employee','Employee ID','Department','Last working day','Status','Current stage','Approved stages'],...records.map(r=>[r.id,r.name,r.employeeId,r.department,r.lastDay,status(r),current(r),(r.decisions||[]).length])];download(new Blob(['\ufeff'+data.map(row=>row.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'Employee_Resignation_Clearance.csv')}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.view));roleEl.onchange=()=>{role=roleEl.value;render()};
(async()=>{try{const opening=indexedDB.open('clearpath-employee-clearance-v1',1);opening.onupgradeneeded=()=>opening.result.createObjectStore('data');db=await request(opening);records=await request(tx('data').get('records'))||[];routing=await request(tx('data').get('routing'))||{};render()}catch(e){app.innerHTML='<div class="notice">Browser storage is unavailable. Enable site storage to use the app.</div>'}})();
</script></body></html>
